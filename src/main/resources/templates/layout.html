<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/select2.min.css}" rel="stylesheet">

    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body>
<div layout:fragment="content"></div>

<!-- Toast notification -->
<div aria-live="polite" aria-atomic="true"
     style="position: fixed; bottom: 20px; right: 20px; z-index: 1100;">
    <div id="toast" class="toast" role="alert"
         aria-live="assertive" aria-atomic="true"
         data-delay="4000">
        <div class="toast-header">
            <strong id="toastTitle" class="mr-auto">Notification</strong>
            <button type="button" class="ml-2 mb-1 close"
                    data-dismiss="toast" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div id="toastBody" class="toast-body"></div>
    </div>
</div>

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/select2.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<script th:src="@{/js/utils.js}"></script>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>

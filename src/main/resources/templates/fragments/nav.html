<div th:fragment="navbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar navbar-expand-lg navbar-light bg-light position-relative">
        <div class="container-fluid">

            <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/book}">Books</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/book/edition/new}">Books Editions</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/genre}">Genres</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/publisher}">Publishers</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/author}">Authors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/mvc/history}">Purchase history</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/mvc/public/shop/books}">Shop</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/mvc/admin/logs/all}">Login logs</a>
                    </li>
                </ul>

                <ul class="navbar-nav position-relative">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/mvc/public/shop/cart}">
                            <i class="bi bi-cart-fill fs-1" style="font-size: 1.75rem;"></i>
                        </a>
                    </li>

                    <li class="nav-item position-relative" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="#" id="userIcon">
                            <i class="bi bi-person-circle fs-1" style="font-size: 1.75rem;"></i>
                        </a>
                        <div id="userDropdown" class="user-dropdown">
                            <p>
                                Logged in as:
                                <strong th:text="${#authentication.name}">Username</strong>
                            </p>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-link">Logout</button>
                            </form>
                        </div>
                    </li>

                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/mvc/public/auth/login}">
                            <i class="bi bi-person-circle fs-1" style="font-size: 1.75rem;"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <style>
        .user-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 5px;
            background: white;
            border: 1px solid #ccc;
            border-radius: .5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
            min-width: 200px;
            z-index: 1000;
        }
        .user-dropdown.active {
            display: block;
        }
    </style>

    <script src="/js/dropdown.js"></script>
</div>

<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title th:text="#{nav.violations}">My Violations</title>
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container py-4">
        <h2 class="mb-4" th:text="#{nav.violations}">My Violations</h2>

        <div id="violations-status" class="text-muted mb-3" th:text="#{violations.loading}">
            Loading violations...
        </div>

        <div id="violations-container"></div>

        <div class="modal fade" id="appeal-modal" tabindex="-1"
             role="dialog" aria-labelledby="appeal-modal-title"
             aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <form id="appeal-form" enctype="multipart/form-data">
                        <div class="modal-header">
                            <h5 class="modal-title" id="appeal-modal-title" th:text="#{violations.appeal.raise}">
                                Raise an Appeal
                            </h5>
                            <button type="button" class="close"
                                    data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>

                        <div class="modal-body">
                            <input type="hidden" id="appeal-violation-id"
                                   name="violationId">

                            <div class="form-group">
                                <label for="appeal-title" th:text="#{violations.appeal.title}">Title</label>
                                <input type="text" class="form-control"
                                       id="appeal-title" name="title"
                                       maxlength="150" required>
                            </div>

                            <div class="form-group">
                                <label for="appeal-message" th:text="#{violations.appeal.explanation}">Explanation</label>
                                <textarea class="form-control"
                                          id="appeal-message" name="message"
                                          rows="5" maxlength="5000"
                                          required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="appeal-evidence" th:text="#{violations.appeal.evidence}">
                                    Evidence (optional)
                                </label>
                                <input type="file" class="form-control-file"
                                       id="appeal-evidence" name="evidence"
                                       multiple accept="image/*,.pdf">
                                <small class="form-text text-muted" th:text="#{violations.appeal.evidence.info}">
                                    You can attach multiple images or PDF files.
                                </small>
                            </div>

                            <div id="appeal-error"
                                 class="text-danger small"></div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    data-dismiss="modal" th:text="#{cancel}">Cancel</button>
                            <button type="submit" id="appeal-submit"
                                    class="btn btn-primary" th:text="#{violations.appeal.submit}">
                                Submit Appeal
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/violations.js}"></script>
</th:block>
</body>
</html>

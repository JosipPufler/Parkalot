<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">

<head>
    <title>Manage Areas</title>
</head>

<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container-fluid py-4">
        <h2 class="mb-4">Manage Parking Areas</h2>

        <div class="row">
            <!-- Area form -->
            <div class="col-lg-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        <strong>Area details</strong>
                    </div>

                    <div class="card-body">
                        <div class="form-group">
                            <label for="area-select">Existing areas</label>
                            <select id="area-select" class="form-control select2">
                                <option value="">Select an area...</option>
                            </select>
                        </div>

                        <hr>

                        <form id="area-form">
                            <input type="hidden" id="area-id">

                            <div class="form-group">
                                <label for="area-name">Name</label>
                                <input type="text" id="area-name"
                                       class="form-control" required
                                       maxlength="100">
                            </div>

                            <div class="form-group">
                                <label for="area-zone">Zone</label>
                                <select id="area-zone" class="form-control select2" required>
                                    <option value="">Select a zone...</option>
                                    <option value="ZONE_1">Zone I</option>
                                    <option value="ZONE_2">Zone II</option>
                                    <option value="ZONE_3">Zone III</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Coordinates</label>
                                <p class="text-muted small mb-2">
                                    Click the map to add points. Drag markers to move them.
                                    Use the remove buttons to delete individual points.
                                </p>

                                <div id="coordinate-list"
                                     class="list-group mb-2"></div>

                                <small id="coordinate-count"
                                       class="text-muted">
                                    0 points
                                </small>
                            </div>

                            <button type="submit" id="save-area"
                                    class="btn btn-primary btn-block">
                                Create area
                            </button>

                            <button type="button" id="delete-area"
                                    class="btn btn-danger btn-block"
                                    disabled>
                                Delete area
                            </button>

                            <button type="button" id="new-area"
                                    class="btn btn-outline-secondary btn-block">
                                Clear / New area
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Map -->
            <div class="col-lg-8 mb-3">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between">
                        <strong>Area map</strong>
                        <span id="map-status" class="text-muted small">
                            Loading areas...
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div id="area-map"
                             style="height: 650px; width: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/leaflet.css}">
    <link rel="stylesheet" th:href="@{/css/areas.css}">
</th:block>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/leaflet.js}"></script>
    <script th:src="@{/js/areas.js}"></script>
</th:block>
</body>
</html>

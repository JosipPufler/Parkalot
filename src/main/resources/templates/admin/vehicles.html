<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout.html}">

<head>
    <title th:text="#{vehicle.manage}">Manage Vehicles</title>
</head>

<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <span id="admin-flag" sec:authorize="hasRole('ADMIN')" hidden></span>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{vehicle.manage}">Manage Vehicles</h2>

            <button class="btn btn-primary"
                    id="create-vehicle"
                    type="button" th:text="#{vehicle.add}">
                <i class="bi bi-plus-lg"></i>
                Add vehicle
            </button>
        </div>

        <div id="vehicles-status" class="text-muted mb-3"></div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th th:text="#{vehicle.licensePlate}">Licence plate</th>
                    <th th:text="#{vehicle.make}">Make</th>
                    <th th:text="#{vehicle.model}">Model</th>
                    <th th:text="#{vehicle.year}">Year</th>
                    <th th:text="#{vehicle.owners}">Owners</th>
                    <th th:text="#{actions}" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="vehicles-table-body"></tbody>
            </table>
        </div>

    </div>

    <div class="modal fade" id="vehicle-modal"
         tabindex="-1" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="vehicle-modal-title" th:text="#{vehicle.add}">
                        Add vehicle
                    </h5>

                    <button type="button" class="close"
                            data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>

                <div class="modal-body">

                    <form id="vehicle-admin-form">

                        <input type="hidden" id="vehicle-id">

                        <div class="form-group">
                            <label for="vehicle-make" th:text="#{vehicle.make}">Make</label>
                            <input type="text" class="form-control"
                                   id="vehicle-make" required>
                        </div>

                        <div class="form-group">
                            <label for="vehicle-model" th:text="#{vehicle.model}">Model</label>
                            <input type="text" class="form-control"
                                   id="vehicle-model" required>
                        </div>

                        <div class="form-group">
                            <label for="vehicle-year" th:text="#{vehicle.year}">Year</label>
                            <input type="number" class="form-control"
                                   id="vehicle-year"
                                   min="1900" required>
                        </div>

                        <div class="form-group">
                            <label for="vehicle-licence-plate" th:text="#{vehicle.licensePlate}">Licence plate</label>
                            <input type="text" class="form-control"
                                   id="vehicle-licence-plate" required>
                        </div>

                        <div class="form-group">
                            <label for="vehicle-owners" th:text="#{vehicle.owners}">Owners</label>
                            <select id="vehicle-owners"
                                    class="form-control select2"
                                    multiple required>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="vehicle-emission-class"
                                   th:text="#{vehicle.emissionClass}">
                                Emission class
                            </label>

                            <select id="vehicle-emission-class"
                                    class="form-select"
                                    required>
                                <option value=""
                                        selected
                                        disabled
                                        th:text="#{vehicle.emissionClass.select}">
                                    Select emission class
                                </option>

                                <option value="EURO_1">Euro 1</option>
                                <option value="EURO_2">Euro 2</option>
                                <option value="EURO_3">Euro 3</option>
                                <option value="EURO_4">Euro 4</option>
                                <option value="EURO_5">Euro 5</option>
                                <option value="EURO_6">Euro 6</option>
                                <option value="EURO_7">Euro 7</option>
                            </select>
                        </div>

                    </form>

                    <div id="vehicle-form-status"
                         class="small mt-2"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal" th:text="#{cancel}">
                        Cancel
                    </button>

                    <button type="submit" form="vehicle-admin-form"
                            class="btn btn-primary" id="save-vehicle" th:text="#{vehicle.save}">
                        Save vehicle
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/admin/vehicles.js}"></script>
</th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout.html}">

<head>
    <title>Manage Users</title>
</head>

<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <span id="admin-flag" sec:authorize="hasRole('ADMIN')" hidden></span>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Manage Users</h2>
        </div>

        <div id="users-status" class="text-muted mb-3">
            Loading users...
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit user modal -->
    <div class="modal fade" id="user-modal"
         tabindex="-1" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="user-modal-title">
                        Edit User
                    </h5>

                    <button type="button" class="close"
                            data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>

                <div class="modal-body">
                    <form id="user-admin-form">

                        <input type="hidden" id="user-id">

                        <div class="form-group">
                            <label for="user-first-name">First name</label>
                            <input type="text" class="form-control"
                                   id="user-first-name" required>
                        </div>

                        <div class="form-group">
                            <label for="user-last-name">Last name</label>
                            <input type="text" class="form-control"
                                   id="user-last-name" required>
                        </div>

                        <div class="form-group">
                            <label for="user-email">Email</label>
                            <input type="email" class="form-control"
                                   id="user-email" required>
                        </div>

                        <div class="form-group">
                            <label for="user-role">Role</label>
                            <select id="user-role" class="form-control" required>
                                <option value="USER">User</option>
                                <option value="OFFICER">Officer</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>

                    </form>

                    <div id="user-form-status" class="small mt-2"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" form="user-admin-form"
                            class="btn btn-primary" id="save-user">
                        Save changes
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/admin/users.js}"></script>
</th:block>

</body>
</html>

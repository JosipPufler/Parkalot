<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>My Appeals</title>
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/nav :: navbar}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
            <h2 class="mb-2">My Appeals</h2>

            <div class="btn-group mb-2" role="group" aria-label="Filter appeals">
                <button type="button"
                        class="btn btn-primary active"
                        data-appeal-filter="all">
                    All
                </button>
                <button type="button"
                        class="btn btn-outline-primary"
                        data-appeal-filter="active">
                    Active
                </button>
                <button type="button"
                        class="btn btn-outline-primary"
                        data-appeal-filter="inactive">
                    Inactive
                </button>
            </div>
        </div>

        <div id="appeals-status" class="text-muted mb-3">
            Loading appeals...
        </div>

        <div id="appeals-container" th:attr="data-user-role=${userRole}"></div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/appeals.js}"></script>
</th:block>
</body>
</html>
